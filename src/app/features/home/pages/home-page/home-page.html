<section class="hero gutter" aria-labelledby="home-title">
  <h1 id="home-title" class="hero__title" i18n="@@home.title">Le Restaurant</h1>
  <p class="hero__lead" i18n="@@home.tagline">Cuisine maison, à emporter ou sur place.</p>
  <a class="btn" routerLink="/commander" i18n="@@home.cta">Commander</a>
</section>

<section id="infos" class="section gutter" aria-labelledby="infos-title">
  <h2 id="infos-title" class="visually-hidden" i18n="@@home.infos.title">Infos pratiques</h2>
  <dl class="facts">
    <div>
      <dt i18n="@@home.info.address">Adresse</dt>
      <dd>12 rue Exemple, 75000 Paris</dd>
    </div>
    <div>
      <dt i18n="@@home.info.hours">Horaires</dt>
      <dd i18n="@@home.info.hoursValue">Mardi – samedi, 11 h 30 – 22 h</dd>
    </div>
    <div>
      <dt i18n="@@home.info.phone">Téléphone</dt>
      <dd>01 23 45 67 89</dd>
    </div>
  </dl>
</section>
