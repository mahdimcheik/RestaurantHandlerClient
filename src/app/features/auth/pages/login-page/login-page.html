<app-auth-layout>
  <h1 class="auth__title">Connexion</h1>
  <p class="auth__lead">
    Pas encore de compte ?
    <a routerLink="/auth/inscription" [queryParams]="{ returnUrl: returnUrl() }">Créer un compte</a>
  </p>

  @if (error()) {
    <p class="alert alert--error" role="alert">{{ error() }}</p>
  }

  <form class="form" novalidate (submit)="onSubmit($event)">
    <app-text-field [field]="form.email" type="email" autocomplete="email" label="E-mail" />
    <app-text-field
      [field]="form.password"
      type="password"
      autocomplete="current-password"
      label="Mot de passe"
    />
    <a class="form__link" routerLink="/auth/mot-de-passe-oublie"> Mot de passe oublié ? </a>
    <button type="submit" class="btn form__submit" [disabled]="form().submitting()">
      @if (form().submitting()) {
        Connexion…
      } @else {
        Se connecter
      }
    </button>
  </form>

  <app-google-sign-in (credential)="onGoogle($event)" />
</app-auth-layout>
