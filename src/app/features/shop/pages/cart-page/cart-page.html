<div class="brand brand--1 brand-ui brand-page">
  <div class="waves" aria-hidden="true"></div>
  <app-site-topbar />

  <section class="order-page order-page--narrow gutter" aria-labelledby="cart-title">
    <p class="eyebrow" i18n="@@shop.order.eyebrow">Commander</p>
    <h1 id="cart-title" class="display-title display-title--md" i18n="@@shop.cartTitle">Panier</h1>

    @if (cart.removed().length > 0) {
      <p class="alert alert--error" role="alert" i18n="@@shop.removedFromCart">
        Retiré de votre panier, plus à la carte : {{ cart.removed().join(', ') }}.
      </p>
    }

    <div class="order-panel">
      <app-cart-summary />
    </div>
    <a class="btn-brand" routerLink="/commander" i18n="@@shop.continue">Continuer mes achats</a>
  </section>
</div>
