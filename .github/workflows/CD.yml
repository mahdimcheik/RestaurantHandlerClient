name: CD

# Release : git tag v1.0.0 && git push origin v1.0.0
# Tests → image Docker Hub (tag de version + latest) → déploiement SSH sur Acer
# dans ~/restauranthandler/front-end (compose : docker-compose.yml de ce dépôt).
on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test -- --watch=false

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build the Docker image
        run: |
          docker build --target prod-runtime \
            -t mahdimcheik/restauranthandler-client:${{ steps.version.outputs.tag }} \
            -t mahdimcheik/restauranthandler-client:latest .

      - name: Push the Docker image to Docker Hub
        run: docker push --all-tags mahdimcheik/restauranthandler-client

      - name: Deploy on Acer via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          # Met à jour UNIQUEMENT la ligne IMAGE_TAG du .env. Retour arrière : remettre l'ancien
          # tag dans le .env puis `docker compose up -d`.
          script: |
            set -e
            cd ~/restauranthandler/front-end
            touch .env
            grep -v '^IMAGE_TAG=' .env > .env.tmp || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env.tmp
            mv .env.tmp .env
            docker compose pull client
            docker compose up -d client
            docker image prune -f
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
