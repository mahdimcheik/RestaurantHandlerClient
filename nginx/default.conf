# Conteneur front : sert la SPA et relaie /api, /hubs, /hangfire vers l'API (même origine :
# cookies SameSite=Strict, pas de CORS). TLS terminé en amont par Nginx Proxy Manager.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Résolution à la requête (DNS Docker) : nginx démarre même si l'API est arrêtée.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api container-restauranthandler-api:8080;

    # En-têtes communs vers l'API. X-Forwarded-For est transmis TEL QUEL depuis NPM, sans y
    # ajouter l'adresse de NPM : l'API ne lit que la dernière entrée (ForwardLimit = 1), et une
    # adresse privée en dernier désactiverait le rate limiting par IP.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # API REST : le préfixe /api est retiré (comme proxy.conf.mjs en dev).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api;
    }

    # SignalR (KDS, suivi de commande) : WebSocket, connexions longues.
    location /hubs/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_pass http://$api;
    }

    # Tableau de bord Hangfire (Manager).
    location /hangfire {
        proxy_pass http://$api;
    }

    # Fichiers que le service worker doit toujours revalider pour voir les nouvelles versions.
    location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest|theme-init\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fichiers avec empreinte dans le nom (outputHashing: all) : cache long.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Routes Angular : tout chemin inconnu renvoie index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
